[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "echoloom"
version = "0.1.0"
description = "Persistent fictional character creation, conversation and refinement"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2", "pydantic-settings>=2.7,<3", "openai>=2,<4", "pillow>=11,<14", "cryptography>=44,<48", "httpx>=0.28,<1", "tzdata>=2025",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.17,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/mvp"]
pythonpath = ["src"]
